 je_fia_holy:0 "圣地与宗教影响力"
 je_fia_holy_reason:0 "耶路撒冷的控制变化与礼拜限制引发跨国宗教诉求。承诺并不等于成果；只有实际恢复通行才结算忠诚收益。"
 je_fia_holy_status:0 "圣地严重程度：[JournalEntry.GetCountry.MakeScope.Var('fia_holy_severity_display').GetValue|0]/3。0正常、1控制变化、2礼拜受限或战争破坏、3严重破坏。通过决议查看并回应各宗教诉求。\n以下各行为护教影响力 / 宗教权威。\n天主教: [JournalEntry.GetCountry.MakeScope.Var('fia_holy_catholic_influence').GetValue|0] / [JournalEntry.GetCountry.MakeScope.Var('fia_holy_catholic_authority').GetValue|0]\n新教: [JournalEntry.GetCountry.MakeScope.Var('fia_holy_protestant_influence').GetValue|0] / [JournalEntry.GetCountry.MakeScope.Var('fia_holy_protestant_authority').GetValue|0]\n东正教: [JournalEntry.GetCountry.MakeScope.Var('fia_holy_orthodox_influence').GetValue|0] / [JournalEntry.GetCountry.MakeScope.Var('fia_holy_orthodox_authority').GetValue|0]\n逊尼派: [JournalEntry.GetCountry.MakeScope.Var('fia_holy_sunni_influence').GetValue|0] / [JournalEntry.GetCountry.MakeScope.Var('fia_holy_sunni_authority').GetValue|0]\n什叶派: [JournalEntry.GetCountry.MakeScope.Var('fia_holy_shiite_influence').GetValue|0] / [JournalEntry.GetCountry.MakeScope.Var('fia_holy_shiite_authority').GetValue|0]\n犹太教: [JournalEntry.GetCountry.MakeScope.Var('fia_holy_jewish_influence').GetValue|0] / [JournalEntry.GetCountry.MakeScope.Var('fia_holy_jewish_authority').GetValue|0]"
 fia_holy_relief_cost:0 "圣地救济与外交协调"
 fia_holy_credibility:0 "护教成果信誉"
 fia_holy_open:0 "保障耶路撒冷礼拜与朝圣"
 fia_holy_open_desc:0 "为所有关联宗教恢复通行；移除本Mod的宗教活动限制。不能瞬间修复战争破坏。"
 fia_holy_restrict:0 "限制耶路撒冷宗教活动"
