l_simp_chinese:
 fia.ack:0 "知悉。"
 fia.1.t:0 "地方信仰争端"
 fia.1.d:0 "[SCOPE.sState('fia_event_state').GetName]的宗教社群要求政府回应。当地紧张度：[SCOPE.sState('fia_event_state').MakeScope.Var('fia_tension').GetValue|0]/100。"
 fia.1.f:0 "矛盾来自政策限制与地方困境；不同信仰本身不构成罪责。"
 fia.1.a:0 "调解：紧张度−15，持续缓和一年；承担行政成本。"
 fia.1.b:0 "调查：紧张度−5，承担半年的行政成本。"
 fia.1.c:0 "镇压：紧张度+10，产生重大事件并增加激进者。"
 fia.2.t:0 "同教社群请求保护"
 fia.2.d:0 "[SCOPE.sCountry('fia_event_host').GetName]境内[SCOPE.sState('fia_event_state').GetName]的同教社群请求介入。我们可以先提出五年地方保障要求。"
 fia.2.f:0 "保护意味着承诺；交涉失败并不自动宣战。"
 fia.2.a:0 "提出保障要求，等待对方回应。"
 fia.2.b:0 "不承担这项承诺，进入三年干涉冷却。"
 fia.3.t:0 "外国要求宗教保障"
 fia.3.d:0 "[SCOPE.sCountry('fia_event_patron').GetName]要求保障[SCOPE.sState('fia_event_state').GetName]的宗教活动，停止当地镇压并接受五年监督。"
 fia.3.f:0 "这是一项地方行政安排，不会改变国教、全国法律或人口信仰。拒绝将给予对方一年内提出宗教保障外交博弈的理由。"
 fia.3.a:0 "接受五年保障，承担地方成本及教权派反弹。"
 fia.3.b:0 "拒绝外国监督。"
 fia.4.t:0 "宗教保障达成"
 fia.4.d:0 "地方镇压停止，五年履约期开始。保护国持续承担50外交影响力与25行政力成本；地方承担5%税收损失并获得0.5生活水平。"
 fia.4.f:0 "没有人口被立即改宗，法律接纳程度也不会被这份行政安排直接改写。"
 fia.5.t:0 "交涉破裂或保障被撤销"
 fia.5.d:0 "一年内可以提出“保障宗教权利”外交博弈。必须仍满足地区利益、同教联系、有效危机及原版外交条件；现有停战协定不会被绕过。"
 fia.5.f:0 "我们可以通过外交视图选择目标，也可以撤回承诺。战争不会自动开始。"
 fia.6.t:0 "五年和约履行完毕"
 fia.6.d:0 "地方保障已履行60个月。监督成本结束，保护国获得两年外交信誉修正，并进入三年干涉冷却。"
 fia.6.f:0 "条约的价值在履约中体现。"
 fia.7.t:0 "宗教矛盾成为公开危机"
 fia.7.d:0 "某地区紧张度达到50，持续矛盾已形成重大事件记录。达到70后，具备同教联系和当地利益的外国可能收到保护请求。"
 fia.7.f:0 "及时调解或改善政教政策仍然可以缓和矛盾。"
 fia.8.t:0 "审议宗教干涉"
 fia.8.d:0 "目标：[SCOPE.sCountry('fia_event_host').GetName]；地区：[SCOPE.sState('fia_event_state').GetName]。在外交视图的外交博弈列表中选择“保障宗教权利”，再选择该地区。此入口由原版检查外交限制和战争代价。"
 fia.8.f:0 "初始目标花费5恶名、20调动筹码，需控制目标地区；胜利只执行地方保障，不转移领土。"
 fia_review_crisis:0 "处理国内宗教争端"
 fia_review_intervention:0 "审议宗教干涉"
 fia_withdraw_protection:0 "撤回宗教保护承诺"
 fia_revoke_guarantees:0 "撤销所有地方宗教保障"
 fia_review_crisis_desc:0 "选择本国紧张度最高且未处于保障期的地区。每年最多处理一次。"
 fia_review_intervention_desc:0 "查看当前目标与外交博弈操作说明。本决议不会直接宣战。"
 fia_withdraw_protection_desc:0 "撤回当前承诺并停止监督成本。已生效的地方保障继续履行，且不会给予保护国完成奖励。"
 fia_revoke_guarantees_desc:0 "同时撤销本国所有有效保障，紧张度设为80；仍存在的保护国得到一年交涉理由。原版停战协定仍有效。"
 fia_review_crisis_tooltip:0 "处理国内宗教争端"
 fia_review_intervention_tooltip:0 "审议宗教干涉"
 fia_withdraw_protection_tooltip:0 "撤回宗教保护承诺"
 fia_revoke_guarantees_tooltip:0 "撤销所有地方宗教保障"
 je_fia_overview:0 "信仰与干涉"
 je_fia_overview_reason:0 "宗教限制与地方动乱可能形成危机。25紧张度触发国内处置，50形成重大事件，70允许外国提出保护请求。查看决议以处置争端。"
 je_fia_overview_status:0 "受关注地区：[JournalEntry.GetCountry.MakeScope.Var('fia_case_count').GetValue|0]；最高紧张度：[JournalEntry.GetCountry.MakeScope.Var('fia_max_tension').GetValue|0]/100；宗教干涉疲劳：[JournalEntry.GetCountry.MakeScope.Var('fia_fatigue').GetValue|0]/100。"
 je_fia_intervention:0 "宗教保护承诺"
 je_fia_intervention_reason:0 "先提出地方保障要求；遭拒后可在一年内通过外交视图提出保障宗教权利。达成保障后承担五年监督成本。可以在没有进行中的博弈或战争时撤回。"
 je_fia_intervention_status:0 "目标地区紧张度：[JournalEntry.GetCountry.MakeScope.ScriptValue('fia_display_tension')|0]/100；护教压力以该紧张度表示。履约：[JournalEntry.GetCountry.MakeScope.ScriptValue('fia_display_accord_months')|0]/60个月。"
