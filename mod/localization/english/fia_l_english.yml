l_english:
 fia.ack:0 "Understood."
 fia.1.t:0 "A Local Religious Dispute"
 fia.1.d:0 "Religious communities in [SCOPE.sState('fia_event_state').GetName] demand a response. Local tension: [SCOPE.sState('fia_event_state').MakeScope.Var('fia_tension').GetValue|0]/100."
 fia.1.f:0 "Policy restrictions and local hardship drive the dispute; difference of faith alone is no wrongdoing."
 fia.1.a:0 "Mediate: −15 tension, one year of conciliation; pay an administrative cost."
 fia.1.b:0 "Investigate: −5 tension; pay six months of administrative costs."
 fia.1.c:0 "Repress: +10 tension, a documented incident and more radicals."
 fia.2.t:0 "A Petition for Religious Protection"
 fia.2.d:0 "A community sharing our state faith in [SCOPE.sState('fia_event_state').GetName], [SCOPE.sCountry('fia_event_host').GetName], requests intervention. We may first seek a five-year local guarantee."
 fia.2.f:0 "Protection creates obligations. Failed talks do not automatically mean war."
 fia.2.a:0 "Request guarantees and await a response."
 fia.2.b:0 "Decline this commitment; take a three-year intervention cooldown."
 fia.3.t:0 "A Foreign Request for Guarantees"
 fia.3.d:0 "[SCOPE.sCountry('fia_event_patron').GetName] requests safeguards for religious activity in [SCOPE.sState('fia_event_state').GetName], an end to local repression and five years of monitoring."
 fia.3.f:0 "This is a local administrative arrangement. It changes neither the state faith, national laws nor anyone’s religion. Refusal grants a one-year opportunity to raise a religious-guarantee diplomatic play."
 fia.3.a:0 "Accept five-year guarantees, local costs and a Devout backlash."
 fia.3.b:0 "Reject foreign supervision."
 fia.4.t:0 "Religious Guarantees Agreed"
 fia.4.d:0 "Local repression ends and a five-year compliance period begins. The protector pays 50 Influence and 25 Bureaucracy; the locality loses 5% tax collection and gains 0.5 Standard of Living."
 fia.4.f:0 "No population is instantly converted, and this administrative arrangement does not directly alter legal acceptance."
 fia.5.t:0 "Guarantees Refused or Revoked"
 fia.5.d:0 "A religious-guarantee diplomatic play may be raised for one year, provided regional interest, a shared faith, a live crisis and vanilla diplomatic conditions remain valid. Existing truces are respected."
 fia.5.f:0 "Use the diplomatic view to select the target, or withdraw the commitment. War does not begin automatically."
 fia.6.t:0 "Five Years of Compliance"
 fia.6.d:0 "Local guarantees have lasted 60 months. Monitoring costs end; the protector receives two years of diplomatic credit and a three-year intervention cooldown."
 fia.6.f:0 "The value of a treaty lies in its execution."
 fia.7.t:0 "A Religious Crisis Becomes Public"
 fia.7.d:0 "A locality has reached 50 tension. Persistent unrest now constitutes a documented incident. At 70, a foreign country sharing the community’s faith and holding a regional interest may receive a protection petition."
 fia.7.f:0 "Mediation or reform of religious policy can still defuse the dispute."
 fia.8.t:0 "Review Religious Intervention"
 fia.8.d:0 "Target: [SCOPE.sCountry('fia_event_host').GetName]; locality: [SCOPE.sState('fia_event_state').GetName]. In the diplomatic lens, choose Protect Religious Rights and select this state. The native interface checks diplomatic restrictions and war costs."
 fia.8.f:0 "The starting goal costs 5 Infamy and 20 Maneuvers and requires control of the target state. Enforcement grants local guarantees without transferring territory."
 fia_review_crisis:0 "Review Domestic Religious Disputes"
 fia_review_intervention:0 "Review Religious Intervention"
 fia_withdraw_protection:0 "Withdraw Religious Protection"
 fia_revoke_guarantees:0 "Revoke All Local Religious Guarantees"
 fia_review_crisis_desc:0 "Review the most tense unprotected locality. Available once a year."
 fia_review_intervention_desc:0 "Review the current target and instructions for the native diplomatic play. This decision does not declare war."
 fia_withdraw_protection_desc:0 "Withdraw the commitment and end monitoring costs. Existing local guarantees continue, without awarding completion credit to the former protector."
 fia_revoke_guarantees_desc:0 "Revoke every active guarantee, set local tension to 80, and grant surviving protectors a one-year reason to intervene. Vanilla truces still apply."
 fia_review_crisis_tooltip:0 "Review Domestic Religious Disputes"
 fia_review_intervention_tooltip:0 "Review Religious Intervention"
 fia_withdraw_protection_tooltip:0 "Withdraw Religious Protection"
 fia_revoke_guarantees_tooltip:0 "Revoke All Local Religious Guarantees"
 je_fia_overview:0 "Faith and Intervention"
 je_fia_overview_reason:0 "Religious restrictions combined with local turmoil can create a crisis: domestic response at 25 tension, a major incident at 50, foreign protection requests at 70. Use Decisions to respond."
 je_fia_overview_status:0 "Tracked localities: [JournalEntry.GetCountry.MakeScope.Var('fia_case_count').GetValue|0]; maximum tension: [JournalEntry.GetCountry.MakeScope.Var('fia_max_tension').GetValue|0]/100; intervention fatigue: [JournalEntry.GetCountry.MakeScope.Var('fia_fatigue').GetValue|0]/100."
 je_fia_intervention:0 "A Religious Protection Commitment"
 je_fia_intervention_reason:0 "Seek local guarantees first. Refusal opens a one-year window to raise Protect Religious Rights in the diplomatic lens. An agreement requires five years of monitoring. Withdraw when no related play or war is in progress."
 je_fia_intervention_status:0 "Local tension / protection pressure: [JournalEntry.GetCountry.MakeScope.ScriptValue('fia_display_tension')|0]/100. Compliance: [JournalEntry.GetCountry.MakeScope.ScriptValue('fia_display_accord_months')|0]/60 months."
