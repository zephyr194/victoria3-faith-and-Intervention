 je_fia_holy:0 "Holy Sites and Religious Influence"
 je_fia_holy_reason:0 "Changes in Jerusalem’s control and worship restrictions generate international religious petitions. Promises are not results: loyalty requires restored access."
 je_fia_holy_status:0 "Site severity: [JournalEntry.GetCountry.MakeScope.Var('fia_holy_severity_display').GetValue|0]/3. 0 normal, 1 control change, 2 worship restrictions or wartime damage, 3 severe damage. Use Decisions to review religious petitions.\nThe rows below show protection influence / religious authority.\nCatholic: [JournalEntry.GetCountry.MakeScope.Var('fia_holy_catholic_influence').GetValue|0] / [JournalEntry.GetCountry.MakeScope.Var('fia_holy_catholic_authority').GetValue|0]\nProtestant: [JournalEntry.GetCountry.MakeScope.Var('fia_holy_protestant_influence').GetValue|0] / [JournalEntry.GetCountry.MakeScope.Var('fia_holy_protestant_authority').GetValue|0]\nOrthodox: [JournalEntry.GetCountry.MakeScope.Var('fia_holy_orthodox_influence').GetValue|0] / [JournalEntry.GetCountry.MakeScope.Var('fia_holy_orthodox_authority').GetValue|0]\nSunni: [JournalEntry.GetCountry.MakeScope.Var('fia_holy_sunni_influence').GetValue|0] / [JournalEntry.GetCountry.MakeScope.Var('fia_holy_sunni_authority').GetValue|0]\nShia: [JournalEntry.GetCountry.MakeScope.Var('fia_holy_shiite_influence').GetValue|0] / [JournalEntry.GetCountry.MakeScope.Var('fia_holy_shiite_authority').GetValue|0]\nJewish: [JournalEntry.GetCountry.MakeScope.Var('fia_holy_jewish_influence').GetValue|0] / [JournalEntry.GetCountry.MakeScope.Var('fia_holy_jewish_authority').GetValue|0]"
