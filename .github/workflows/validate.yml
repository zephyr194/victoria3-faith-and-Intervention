name: Validate and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and detect drift
        run: |
          python tools/build_content.py
          git diff --exit-code -- mod
      - name: Validate and test scripts
        run: |
          python tools/validate.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Package experimental builds
        run: |
          python tools/package.py --game-version 1.13
          python tools/package.py --game-version 1.14
      - uses: actions/upload-artifact@v4
        with:
          name: faith-and-intervention-experimental
          path: dist/*.zip
          retention-days: 14
